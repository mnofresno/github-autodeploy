name: One-shot fetch exact SHA into deploy ref

on:
  push:
    branches: ['master']
    paths:
      - '.github/workflows/one-shot-fetch-exact-sha-ref.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Patch exact SHA fetch and add regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/Runner.php')
          lines = path.read_text().splitlines()

          unconditional = "            $repoGitCommandPrefix . ' fetch --force origin main:refs/remotes/origin/main',"
          if lines.count(unconditional) != 1:
              raise SystemExit(f'Expected one unconditional main fetch, found {lines.count(unconditional)}')
          lines.remove(unconditional)

          expected_object = "            $expectedCommitObject = escapeshellarg($this->deployCommitSha . '^{commit}');"
          verify_line = "            $commands[] = $repoGitCommandPrefix . ' rev-parse --verify ' . $expectedCommitObject;"
          reset_line = "            $commands[] = $repoGitCommandPrefix . ' reset --hard ' . $expectedCommit;"
          else_reset = "            $commands[] = $repoGitCommandPrefix . ' reset --hard \"origin/main\"';"

          if expected_object not in lines or verify_line not in lines or reset_line not in lines or else_reset not in lines:
              raise SystemExit('Expected exact-commit command lines were not found')

          idx = lines.index(expected_object)
          lines[idx:idx + 1] = [
              "            $deployTargetRef = 'refs/git-autodeploy/deploy-target';",
              "            $fetchRefspec = escapeshellarg($this->deployCommitSha . ':' . $deployTargetRef);",
              "            $deployTargetCommit = escapeshellarg($deployTargetRef . '^{commit}');",
              "            $deployTargetRefArg = escapeshellarg($deployTargetRef);",
              "            $commands[] = $repoGitCommandPrefix . ' fetch --force origin ' . $fetchRefspec;",
          ]
          lines[lines.index(verify_line)] = "            $commands[] = $repoGitCommandPrefix . ' rev-parse --verify ' . $deployTargetCommit;"
          lines[lines.index(reset_line)] = "            $commands[] = $repoGitCommandPrefix . ' reset --hard ' . $deployTargetRefArg;"
          else_idx = lines.index(else_reset)
          lines.insert(else_idx, "            $commands[] = $repoGitCommandPrefix . ' fetch --force origin main:refs/remotes/origin/main';")

          path.write_text('\n'.join(lines) + '\n')
          PY

          cat > test/RunnerExactCommitFetchTest.php <<'PHP'
          <?php

          namespace Mariano\GitAutoDeploy\Test;

          use Mariano\GitAutoDeploy\ConfigReader;
          use Mariano\GitAutoDeploy\CustomCommands;
          use Mariano\GitAutoDeploy\DeployConfigReader;
          use Mariano\GitAutoDeploy\Executer;
          use Mariano\GitAutoDeploy\IPAllowListManager;
          use Mariano\GitAutoDeploy\Request;
          use Mariano\GitAutoDeploy\Response;
          use Mariano\GitAutoDeploy\Runner;
          use Monolog\Logger;
          use PHPUnit\Framework\TestCase;
          use ReflectionClass;

          class RunnerExactCommitFetchTest extends TestCase {
              public function testExactCommitIsFetchedIntoNamedDeployRef(): void {
                  $sha = str_repeat('a', 40);
                  $repoName = 'test-app';
                  $repoPath = '/tmp/' . $repoName;

                  $request = $this->getMockBuilder(Request::class)
                      ->disableOriginalConstructor()
                      ->onlyMethods(['getQueryParam', 'getQueryParamsAll'])
                      ->getMock();
                  $request->method('getQueryParam')->willReturnMap([
                      [Request::REPO_QUERY_PARAM, $repoName],
                      [Request::KEY_QUERY_PARAM, 'deploy-key'],
                  ]);
                  $request->method('getQueryParamsAll')->willReturn([]);

                  $config = $this->getMockBuilder(ConfigReader::class)
                      ->disableOriginalConstructor()
                      ->onlyMethods(['get', 'resolveRepoTransportConfig'])
                      ->getMock();
                  $config->method('get')->willReturnMap([
                      [ConfigReader::REPOS_BASE_PATH, '/tmp'],
                      [ConfigReader::SSH_KEYS_PATH, '/keys'],
                  ]);
                  $config->method('resolveRepoTransportConfig')->willReturn([
                      'strategy' => 'ssh',
                      'template_uri' => 'git@github.com:test/test-app.git',
                  ]);

                  $deployConfig = $this->createMock(DeployConfigReader::class);
                  $deployConfig->method('fetchRepoConfig')->willReturn(null);
                  $response = $this->createMock(Response::class);

                  $runner = new Runner(
                      $request,
                      $response,
                      $config,
                      $this->createMock(Logger::class),
                      $this->createMock(IPAllowListManager::class),
                      $this->createMock(CustomCommands::class),
                      $deployConfig,
                      $this->createMock(Executer::class)
                  );

                  $reflection = new ReflectionClass($runner);
                  $property = $reflection->getProperty('deployCommitSha');
                  $property->setAccessible(true);
                  $property->setValue($runner, $sha);
                  $method = $reflection->getMethod('builtInCommands');
                  $method->setAccessible(true);
                  $commands = $method->invoke($runner);

                  $gitDir = sys_get_temp_dir() . DIRECTORY_SEPARATOR
                      . 'git-autodeploy-' . sha1($repoPath . '|' . $sha);
                  $prefix = 'GIT_SSH_COMMAND="ssh -i /keys/deploy-key" git --git-dir='
                      . escapeshellarg($gitDir) . ' --work-tree=' . escapeshellarg($repoPath);
                  $deployRef = 'refs/git-autodeploy/deploy-target';

                  $this->assertContains($prefix . ' fetch --force origin ' . escapeshellarg($sha . ':' . $deployRef), $commands);
                  $this->assertContains($prefix . ' rev-parse --verify ' . escapeshellarg($deployRef . '^{commit}'), $commands);
                  $this->assertContains($prefix . ' reset --hard ' . escapeshellarg($deployRef), $commands);
              }
          }
          PHP

          php -l src/Runner.php
          php -l test/RunnerExactCommitFetchTest.php
          git diff --check

          rm .github/workflows/one-shot-fetch-exact-sha-ref.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Runner.php test/RunnerExactCommitFetchTest.php .github/workflows/one-shot-fetch-exact-sha-ref.yml
          git commit -m 'fix: fetch requested deploy SHA into named ref'
          git push origin HEAD:master
