name: One-shot sanitize Runner status tests

on:
  pull_request:
    branches: ['master']
    paths:
      - '.github/workflows/one-shot-sanitize-runner-tests.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/controller-capabilities-and-repo-owner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/controller-capabilities-and-repo-owner
          fetch-depth: 0
      - name: Patch exact legacy assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/RunnerTest.php')
          text = path.read_text()

          replacements = [
              (
                  """        // Verificar que el comando que falló fue 'false' de post_fetch
        $failedStep = $status['failed_step'] ?? null;
        $this->assertNotNull($failedStep, 'Deployment should have a failed_step');
        $this->assertEquals('false', $failedStep['command'] ?? null);
        // La fase puede variar dependiendo de qué comando falle primero, pero verificamos que el comando sea correcto
""",
                  """        // El status público conserva coordenadas verificables, no el comando privado.
        $failedStep = $status['failed_step'] ?? null;
        $this->assertNotNull($failedStep, 'Deployment should have a failed_step');
        $this->assertEquals(DeploymentStatus::PHASE_POST_FETCH, $failedStep['phase'] ?? null);
        $this->assertEquals(1, $failedStep['exit_code'] ?? null);
        $this->assertEquals('post_deploy_check_failed', $status['error_code'] ?? null);
        $this->assertArrayNotHasKey('command', $failedStep);
        $this->assertArrayNotHasKey('output', $failedStep);
""",
              ),
              (
                  """        // Verificar que el exit code es de timeout
        $this->assertEquals(\Mariano\GitAutoDeploy\Executer::EXIT_CODE_TIMEOUT, $failedStep['exit_code'] ?? null);
        // Verificar que el comando es 'sleep 100'
        $this->assertEquals('sleep 100', $failedStep['command'] ?? null);
""",
                  """        // El timeout se expone como código acotado sin revelar el comando.
        $this->assertEquals(\Mariano\GitAutoDeploy\Executer::EXIT_CODE_TIMEOUT, $failedStep['exit_code'] ?? null);
        $this->assertEquals('command_timeout', $status['error_code'] ?? null);
        $this->assertArrayNotHasKey('command', $failedStep);
        $this->assertArrayNotHasKey('output', $failedStep);
""",
              ),
              (
                  """        $matchedStep = null;
        foreach ($status['steps'] as $step) {
            if (($step['command'] ?? '') === 'sh ./scripts/report-docker-image-shas.sh frontend backend notifications') {
                $matchedStep = $step;
                break;
            }
        }

        $this->assertNotNull($matchedStep);
        $this->assertTrue($matchedStep['verbose'] ?? false);
        $this->assertEquals([
            'frontend=sha-frontend',
            'backend=sha-backend',
            'notifications=sha-notifications',
        ], $matchedStep['output'] ?? []);
""",
                  """        $verboseSteps = array_values(array_filter($status['steps'], static function (array $step): bool {
            return ($step['verbose'] ?? false) === true;
        }));

        $this->assertCount(1, $verboseSteps);
        $this->assertTrue($verboseSteps[0]['verbose']);
        $this->assertArrayNotHasKey('command', $verboseSteps[0]);
        $this->assertArrayNotHasKey('output', $verboseSteps[0]);
""",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected legacy assertion block not found: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          rm .github/workflows/one-shot-sanitize-runner-tests.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/RunnerTest.php .github/workflows/one-shot-sanitize-runner-tests.yml
          git commit -m 'test: enforce sanitized Runner deployment status'
          git push origin HEAD:fix/controller-capabilities-and-repo-owner
