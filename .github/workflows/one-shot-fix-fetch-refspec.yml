name: One-shot fix exact commit fetch refspec

on:
  push:
    branches: ['master']
    paths:
      - '.github/workflows/one-shot-fix-fetch-refspec.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Persist origin/main during exact commit fetch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = ' fetch --no-write-fetch-head origin main'
          new = ' fetch --force origin main:refs/remotes/origin/main'

          runner = Path('src/Runner.php')
          runner_text = runner.read_text()
          if runner_text.count(old) != 1:
              raise SystemExit(f'Expected one Runner fetch command, found {runner_text.count(old)}')
          runner.write_text(runner_text.replace(old, new, 1))

          tests = Path('test/RunnerTest.php')
          tests_text = tests.read_text()
          count = tests_text.count(old)
          if count < 2:
              raise SystemExit(f'Expected at least two RunnerTest fetch expectations, found {count}')
          tests.write_text(tests_text.replace(old, new))
          PY

          php -l src/Runner.php
          php -l test/RunnerTest.php
          git diff --check

          rm .github/workflows/one-shot-fix-fetch-refspec.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Runner.php test/RunnerTest.php .github/workflows/one-shot-fix-fetch-refspec.yml
          git commit -m 'fix: persist remote ref before verifying deploy commit'
          git push origin HEAD:master
