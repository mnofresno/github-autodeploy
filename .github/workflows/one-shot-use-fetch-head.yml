name: One-shot use FETCH_HEAD for exact deployments

on:
  push:
    branches: ['master']
    paths:
      - '.github/workflows/one-shot-use-fetch-head.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Replace custom deploy ref with FETCH_HEAD
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/Runner.php')
          lines = path.read_text().splitlines()
          start_line = "            $deployTargetRef = 'refs/git-autodeploy/deploy-target';"
          end_line = "            $commands[] = $repoGitCommandPrefix . ' reset --hard ' . $deployTargetRefArg;"
          if lines.count(start_line) != 1 or lines.count(end_line) != 1:
              raise SystemExit('Expected named deploy-ref block was not found exactly once')
          start = lines.index(start_line)
          end = lines.index(end_line)
          if end < start or end - start != 6:
              raise SystemExit(f'Unexpected named deploy-ref block boundaries: {start}..{end}')
          lines[start:end + 1] = [
              "            $fetchCommit = escapeshellarg($this->deployCommitSha);",
              "            $fetchHeadCommit = escapeshellarg('FETCH_HEAD^{commit}');",
              "            $fetchHead = escapeshellarg('FETCH_HEAD');",
              "            $commands[] = $repoGitCommandPrefix . ' fetch --force origin ' . $fetchCommit;",
              "            $commands[] = $repoGitCommandPrefix . ' rev-parse --verify ' . $fetchHeadCommit;",
              "            $commands[] = $repoGitCommandPrefix . ' reset --hard ' . $fetchHead;",
          ]
          path.write_text('\n'.join(lines) + '\n')
          PY

          php -l src/Runner.php
          php -l test/RunnerExactCommitFetchTest.php
          php -l test/RunnerExactCommitTest.php
          git diff --check

          rm .github/workflows/one-shot-use-fetch-head.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Runner.php .github/workflows/one-shot-use-fetch-head.yml
          git commit -m 'fix: verify exact deployments through FETCH_HEAD'
          git push origin HEAD:master
