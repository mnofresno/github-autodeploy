# Reusable workflow: asynchronous server deployment with polling.
# The public workflow interface is intentionally preserved for all consumers.
name: Reusable Async Deployment

on:
  workflow_call:
    inputs:
      autodeploy_url:
        description: 'Autodeploy server URL(s); separate multiple instances with commas'
        required: true
        type: string
      deploy_key:
        description: 'Compatibility input; authentication is supplied through KEY_FILE_FOR_DEPLOY'
        required: true
        type: string
      repository:
        description: 'Repository name configured on the autodeploy server'
        required: true
        type: string
      commit_sha:
        description: 'Exact full commit SHA to deploy'
        required: true
        type: string
      commit_author:
        description: 'Commit author stored by the deployment audit trail'
        required: true
        type: string
      runs_on:
        description: 'Runner label for the deployment client'
        required: false
        type: string
        default: 'ubuntu-latest'
      env_vars:
        description: 'Pipe-separated KEY=VALUE variables forwarded as DEPLOY_* variables'
        required: false
        type: string
        default: ''
    secrets:
      KEY_FILE_FOR_DEPLOY:
        required: true

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 45
    steps:
      - name: Deploy to Server(s) (Async + Polling)
        uses: mnofresno/github-autodeploy/.github/actions/deploy-and-poll@ef47df23c7e73d4d39e2b5e27fef728941a58d94
        with:
          autodeploy_url: ${{ inputs.autodeploy_url }}
          deploy_key: ${{ secrets.KEY_FILE_FOR_DEPLOY }}
          github_token: ${{ github.token }}
          repository: ${{ inputs.repository }}
          commit_sha: ${{ inputs.commit_sha }}
          commit_author: ${{ inputs.commit_author }}
          env_vars: ${{ inputs.env_vars }}

      - name: Upload sanitized deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence-${{ github.run_id }}
          path: deployment-evidence.jsonl
          if-no-files-found: warn
          retention-days: 14
