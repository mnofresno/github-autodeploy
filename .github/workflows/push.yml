name: Git Autodeploy CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  build_and_run_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, dom, curl, libxml, xml, xmlreader
      - name: Validate composer.json and composer.lock
        run: composer validate --strict
      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php8.1-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php8.1-
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      - name: Run test suite
        shell: bash
        run: |
          set +e
          composer run-script test > phpunit.log 2>&1
          status="$?"
          tail -n 250 phpunit.log
          echo "$status" > phpunit.status
          exit 0
      - name: Upload PHPUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-autodeploy-phpunit-${{ github.run_id }}
          path: phpunit.log
          retention-days: 3
          if-no-files-found: error
      - name: Enforce PHPUnit result
        shell: bash
        run: |
          status="$(cat phpunit.status)"
          [[ "$status" == "0" ]] || exit "$status"

  lint-php-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Lint PHP code (Dry Run)
        run: ./linter/lint.sh --dry-run

  validate-deploy-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate portable deploy client and public status contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/actions/deploy-and-poll/deploy-and-poll.sh
          php -l public/index.php
          php -l src/Request.php
          php -l src/ConfigReader.php
          php -l src/DeploymentStatus.php
          git diff --check
          grep -Fq 'using: composite' .github/actions/deploy-and-poll/action.yml
          grep -Fq 'deployment-evidence.jsonl' .github/workflows/reusable-deploy.yml
          grep -Fq 'create_repo_if_not_exists=true' .github/actions/deploy-and-poll/deploy-and-poll.sh
          grep -Fq 'clone_path=' .github/actions/deploy-and-poll/deploy-and-poll.sh
          grep -Fq 'repo-owner-bootstrap-v1' public/index.php
          grep -Fq 'sanitized-deployment-status-v1' public/index.php
          grep -Fq 'github-actions-run-auth-v1' public/index.php
          grep -Fq "CAPABILITY='github-actions-run-auth-v1'" .github/actions/deploy-and-poll/deploy-and-poll.sh
          grep -Fq 'X-GitHub-Actions-Token' .github/actions/deploy-and-poll/deploy-and-poll.sh
          grep -Fq 'github_token:' .github/workflows/reusable-deploy.yml
          grep -Fq '"enable_clone": true' config.example.json
          if grep -R --line-number --fixed-strings -- '--fail-with-body' .github/actions .github/workflows/reusable-deploy.yml; then
            echo 'Unsupported curl option found in deployment client' >&2
            exit 1
          fi
          if grep -R --line-number --fixed-strings '%{exitcode}' .github/actions .github/workflows/reusable-deploy.yml; then
            echo 'Unsupported curl write-out variable found in deployment client' >&2
            exit 1
          fi
          if grep -R --line-number 'echo .*KEY_FILE_FOR_DEPLOY\|echo .*deployment_url' .github/actions .github/workflows/reusable-deploy.yml; then
            echo 'Potential secret-bearing deployment output found' >&2
            exit 1
          fi
          if grep -n "'key' =>" src/DeploymentStatus.php; then
            echo 'Deployment key must not be persisted in status files' >&2
            exit 1
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: [build_and_run_tests, lint-php-code, validate-deploy-client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && success()
    steps:
      - name: Self-update and verify all controller instances
        env:
          AUTODEPLOY_URL: ${{ vars.AUTODEPLOY_URL }}
        shell: bash
        run: |
          set -u -o pipefail
          IFS=',' read -ra URLS <<< "$AUTODEPLOY_URL"
          ALL_SUCCESS=true

          for i in "${!URLS[@]}"; do
            URL="$(echo "${URLS[$i]}" | xargs)"
            INSTANCE_NUM=$((i + 1))
            echo "Controller $INSTANCE_NUM/${#URLS[@]}: applying self-update"

            response=$(curl -X GET \
              -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 30 \
              --max-time 300 \
              "https://${URL}/self-update" 2>/dev/null || echo "000")

            capability_ok=false
            if [[ "$response" =~ ^2[0-9][0-9]$ ]]; then
              for _attempt in $(seq 1 15); do
                sleep 2
                if curl --silent --show-error --connect-timeout 10 --max-time 30 \
                    "https://${URL}/controller-capabilities" 2>/dev/null \
                    | jq -e '.capabilities | index("repo-owner-bootstrap-v1") != null and index("sanitized-deployment-status-v1") != null and index("github-actions-run-auth-v1") != null' >/dev/null 2>&1; then
                  capability_ok=true
                  break
                fi
              done
            fi

            if [[ "$capability_ok" == "true" ]]; then
              echo "✅ controller self-update and capabilities verified"
            else
              echo "❌ controller self-update or capability verification failed" >&2
              ALL_SUCCESS=false
            fi
          done

          [[ "$ALL_SUCCESS" == "true" ]]
