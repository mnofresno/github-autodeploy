# Trigger the one-shot patch from a workflow already present on master.
name: One-shot GitHub run authentication patch

on:
  pull_request:
    branches: ['master']
    paths:
      - '.github/workflows/one-shot-github-run-auth.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/apply-github-run-auth-patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/apply-github-run-auth-patch
          fetch-depth: 0
      - name: Add exact run authentication headers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/actions/deploy-and-poll/deploy-and-poll.sh')
          text = path.read_text()

          replacements = [
              (
                  'for required in AUTODEPLOY_URL KEY_FILE_FOR_DEPLOY REPOSITORY COMMIT_SHA COMMIT_AUTHOR; do\n',
                  'for required in AUTODEPLOY_URL KEY_FILE_FOR_DEPLOY GITHUB_ACTIONS_TOKEN GITHUB_REPOSITORY GITHUB_RUN_ID REPOSITORY COMMIT_SHA COMMIT_AUTHOR; do\n',
              ),
              (
                  '''if [[ ! "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+$ ]]; then
  echo "The repository key is invalid" >&2
  exit 64
fi
if [[ ! "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
''',
                  '''if [[ ! "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+$ ]]; then
  echo "The repository key is invalid" >&2
  exit 64
fi
if [[ "$GITHUB_REPOSITORY" != "${REPOSITORY_OWNER}/${REPOSITORY}" || ! "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]; then
  echo "The GitHub Actions run identity does not match the deployment repository" >&2
  exit 64
fi
if [[ ! "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
''',
              ),
              (
                  '''    --request POST \\
    --header 'Content-Type: application/json' \\
    --data "$payload" \\
''',
                  '''    --request POST \\
    --header 'Content-Type: application/json' \\
    --header "X-GitHub-Actions-Token: $GITHUB_ACTIONS_TOKEN" \\
    --header "X-GitHub-Repository: $GITHUB_REPOSITORY" \\
    --header "X-Autodeploy-Repository: $REPOSITORY" \\
    --header "X-GitHub-Run-Id: $GITHUB_RUN_ID" \\
    --header "X-GitHub-Sha: $COMMIT_SHA" \\
    --data "$payload" \\
''',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected deploy client fragment not found: {old[:120]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          rm .github/workflows/one-shot-github-run-auth.yml
          bash -n .github/actions/deploy-and-poll/deploy-and-poll.sh
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/actions/deploy-and-poll/deploy-and-poll.sh .github/workflows/one-shot-github-run-auth.yml
          git commit -m 'feat: authenticate exact GitHub Actions request'
          git push origin HEAD:fix/apply-github-run-auth-patch
