name: One-shot patch reusable deploy evidence

on:
  push:
    branches: ['master']
    paths:
      - '.github/workflows/one-shot-patch-reusable-deploy-evidence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Patch reusable deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/reusable-deploy.yml')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f'Expected fragment not found: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '          set -e  # Exit if any command fails\n',
              '          set -e  # Exit if any command fails\n          EVIDENCE_FILE="$GITHUB_WORKSPACE/deployment-evidence.jsonl"\n          : > "$EVIDENCE_FILE"\n',
          )
          replace_once(
              '            echo "   URL: ${deployment_url}"\n',
              '            echo "   Endpoint: https://${INSTANCE_URL} (repository=${REPOSITORY})"\n',
          )
          replace_once(
              '              -w "HTTP_CODE:%{http_code}\\nCURL_EXIT:%{exitcode}\\n" \\\n',
              '              -w "HTTP_CODE:%{http_code}\\n" \\\n',
          )
          replace_once(
              '            # Extract HTTP code and curl exit code from response metadata\n            http_code=$(grep "HTTP_CODE:" "$metadata_file" | cut -d: -f2 || echo "")\n            curl_exit_from_response=$(grep "CURL_EXIT:" "$metadata_file" | cut -d: -f2 || echo "")\n',
              '            # Extract HTTP code from response metadata; Bash already captured curl\'s exit code.\n            http_code=$(grep "HTTP_CODE:" "$metadata_file" | cut -d: -f2 || echo "")\n',
          )

          success_old = '''                echo "📋 Completed steps:"
                echo "$status_response" | jq -r '.steps[] | "   ✓ Step \\(.id + 1): \\(.command) [\\(.phase)] (exit: \\(.exit_code))"' || true
                
                return 0
'''
          success_new = '''                echo "📋 Completed steps:"
                echo "$status_response" | jq -r '.steps[] | "   ✓ Step \\(.id + 1): \\(.command) [\\(.phase)] (exit: \\(.exit_code))"' || true
                echo "$status_response" | jq -c --arg repository "$REPOSITORY" --arg commit_sha "$COMMIT_SHA" --arg run_id "$run_id" '{repository:$repository,commit_sha:$commit_sha,run_id:$run_id,status:(.status // "SUCCESS"),started_at:(.started_at // null),completed_at:(.completed_at // null),failed_step:null}' >> "$EVIDENCE_FILE"
                
                return 0
'''
          replace_once(success_old, success_new)

          failed_old = '''                echo ""
                echo "💡 For more details, check server logs."
                return 1
'''
          failed_new = '''                echo "$status_response" | jq -c --arg repository "$REPOSITORY" --arg commit_sha "$COMMIT_SHA" --arg run_id "$run_id" '{repository:$repository,commit_sha:$commit_sha,run_id:$run_id,status:(.status // "FAILED"),started_at:(.started_at // null),completed_at:(.completed_at // null),failed_step:(if .failed_step then {step_id:(.failed_step.step_id // null),phase:(.failed_step.phase // null),exit_code:(.failed_step.exit_code // null)} else null end)}' >> "$EVIDENCE_FILE"
                echo ""
                echo "💡 For more details, check server logs."
                return 1
'''
          replace_once(failed_old, failed_new)

          if 'Upload sanitized deployment evidence' not in text:
              text = text.rstrip() + '''

      - name: Upload sanitized deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence-${{ github.run_id }}
          path: deployment-evidence.jsonl
          if-no-files-found: warn
          retention-days: 14
'''

          path.write_text(text)
          PY

          rm .github/workflows/one-shot-patch-reusable-deploy-evidence.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/reusable-deploy.yml .github/workflows/one-shot-patch-reusable-deploy-evidence.yml
          git commit -m 'fix: publish portable sanitized deploy evidence'
          git push origin HEAD:master

# Triggered after the workflow was present on the default branch.
